<div class="card">
  <p-toast></p-toast>

<div *ngIf="activeStep === 0">
    <h3>Informations générales</h3>
    <form [formGroup]="surveyForm">
        <div class="form-group">
            <label for="surveyName">Nom de l'enquête</label>
            <span>{{surveyForm.controls['surveyName'].value}}</span>
          </div>
    
          <!-- Description -->
          <div class="form-group">
            <label for="description">Description</label>
            <span>{{surveyForm.controls['description'].value}}</span>
          </div>
    </form>
</div>

<div [style.display]="activeStep === 1 ? 'block' : 'none'">
    <app-questions #questionList [editable]="false"></app-questions>
</div>

<p-toolbar styleClass="mb-6" *ngIf="activeStep === 0 || (!answered && activeStep === 1)">
  <ng-template #end>
    <p-button label="Commencer" icon="pi pi-chevron-right" (click)="nextStep()" *ngIf="activeStep === 0"></p-button>
    <p-button label="Envoyer" icon="pi" (click)="publish()" *ngIf="activeStep === 1"></p-button>
  </ng-template>
</p-toolbar>

<div *ngIf="activeStep === 2">
    <h3>Merci d'avoir répondu à l'enquête</h3>
</div>

</div>
