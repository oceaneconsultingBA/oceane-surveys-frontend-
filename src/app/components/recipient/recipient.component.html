<div class="card">
    <p-toast></p-toast>
    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="Nouveau destinataire" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
        </ng-template>
        <ng-template #end>
            <p-fileUpload mode="basic" accept=".xls, .xlsx" (onSelect)="onFileSelect($event)" customUpload="true" 
             [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block"  />
             &nbsp;
            <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
        </ng-template>
    </p-toolbar>
    <p-table 
    #dt
    [value]="recepients" 
    [tableStyle]="{ 'min-width': '50rem' }" 
    tableStyleClass="p-datatable-striped" 
    [rows]="20"  
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="['firstName', 'lastName', 'company', 'type']"
    [rowHover]="true"
    dataKey="id"
    selectionMode="multiple"
    [(selection)]="selectedRecipients">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="globalSearch($event)" placeholder="Recherche..." />
            </p-iconfield>
        </div>
    </ng-template>
        <ng-template #header>
            <tr>
                <th></th>
                <th pSortableColumn="lastName">Nom <p-sortIcon field="lastName" /></th>
                <th pSortableColumn="firstName">Prénom <p-sortIcon field="firstName" /></th>
                <th>Email</th>
                <th pSortableColumn="company">Compagnie <p-sortIcon field="company" /></th>
                <th pSortableColumn="type">Type <p-sortIcon field="type" /></th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-rc>
            <tr [pSelectableRow]="rowData">
                <td>
                      <p-tableCheckbox [value]="rc">
                  </p-tableCheckbox>
                </td>
                <td>{{ rc.lastName }}</td>
                <td>{{ rc.firstName }}</td>
                <td>{{ rc.email }}</td>
                <td>{{ rc.company }}</td>
                <td>{{ rc.type }}</td>
                <td>
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editRecepient(rc)" />
                    &nbsp;
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteRecepient(rc)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
    <!-- <p>{{selectedRecipients | json}}</p> -->
</div>

<p-dialog [(visible)]="recepientDialog" [style]="{ width: '450px' }"  [appendTo]="'body'" [header]="modalMode === 'CREATE' ? 'Création'+ ' d\'un destinataire' : 'Modification' + ' d\'un destinataire'" [modal]="true">
    <ng-template #content>
        <form [formGroup]="recipientForm" (ngSubmit)="onSubmit()"> 
            <div>
                <label for="firstName" class="block font-bold mb-3">Prénom</label>
                <input type="text" pInputText id="firstName"  formControlName="firstName" required autofocus fluid />
            </div><br/>
            <div>
                <label for="lastName" class="block font-bold mb-3">Nom</label>
                <input type="text" pInputText id="lastName"  formControlName="lastName" required autofocus fluid />
            </div><br/>
            <div>
                <label for="email" class="block font-bold mb-3">Email</label>
                <input type="text" pInputText id="email"  formControlName="email" required autofocus fluid />
            </div><br/>
            <div>
                <label for="company" class="block font-bold mb-3">Entreprise</label>
                <input type="text" pInputText id="company"  formControlName="company" required autofocus fluid />
            </div><br/>
            <div>
                <label for="type" class="block font-bold mb-3">Type</label>
                <p-dropdown id="type" [options]="recipientTypes" formControlName="type" placeholder="Sélectionner un type" required autofocus fluid></p-dropdown>
            </div><br/>
            <button pButton type="submit"  [label]="modalMode === 'CREATE' ? 'Créer' : 'Modifier'" class="p-button-success" style="margin-top: 75px;"></button>
        </form>        
    </ng-template>
</p-dialog>
