<h1 mat-dialog-title>{{data.title}}</h1>
<div mat-dialog-content>
  {{data.message}}
</div>
<div style="float:right;margin:20px;">
  <button pButton pRipple style="margin:0px 10px;" [mat-dialog-close]="true">{{data.confirmation? 'Confirmer' : 'OK'}}</button>
  <button pButton pRipple *ngIf="data.confirmation" [mat-dialog-close]="false">Annuler</button>
</div>
